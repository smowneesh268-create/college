
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adhiparasakthi Engineering College — Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Josefin+Sans:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --maroon-950:#1c0606;
    --maroon-900:#2a0a0a;
    --maroon-800:#3d0f0f;
    --maroon-700:#5c1414;
    --gold-500:#c9a227;
    --gold-400:#d9bb52;
    --gold-200:#f0e2b6;
    --cream:#f6ecd9;
    --ink-dim:#c7ab9a;
    --error:#e08a6b;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:
      radial-gradient(circle at 50% -10%, var(--maroon-800) 0%, var(--maroon-950) 55%),
      var(--maroon-950);
    font-family:'Inter',sans-serif;
    color:var(--cream);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 18px;
    position:relative;
    overflow-x:hidden;
  }
 
  /* faint mandala rings, signature motif echoing the seal's own concentric borders */
  .ring{
    position:fixed;
    border:1px solid rgba(201,162,39,0.14);
    border-radius:50%;
    pointer-events:none;
  }
  .ring1{ width:900px; height:900px; top:-420px; left:50%; transform:translateX(-50%); }
  .ring2{ width:1300px; height:1300px; top:-620px; left:50%; transform:translateX(-50%); border-color:rgba(201,162,39,0.08);}
  .ring3{ width:560px; height:560px; bottom:-360px; right:-200px; border-color:rgba(201,162,39,0.10);}
 
  @media (prefers-reduced-motion: no-preference){
    .ring1{ animation: spin 140s linear infinite; }
    .ring2{ animation: spin 220s linear infinite reverse; }
  }
  @keyframes spin{ to{ transform:translateX(-50%) rotate(360deg);} }
  .ring2{ transform:translateX(-50%); }
  @keyframes spin2{ to{ transform:translateX(-50%) rotate(-360deg);} }
 
  .card{
    position:relative;
    width:100%;
    max-width:408px;
    background:linear-gradient(180deg, rgba(61,15,15,0.9), rgba(28,6,6,0.94));
    border:1px solid rgba(201,162,39,0.35);
    border-radius:6px;
    padding:44px 38px 36px;
    box-shadow:
      0 0 0 1px rgba(0,0,0,0.4),
      0 30px 70px -20px rgba(0,0,0,0.7),
      0 0 60px -15px rgba(201,162,39,0.12);
  }
 
  .card::before, .card::after{
    content:"";
    position:absolute;
    width:22px; height:22px;
    border:1px solid var(--gold-500);
    opacity:0.7;
  }
  .card::before{ top:8px; left:8px; border-right:none; border-bottom:none;}
  .card::after{ bottom:8px; right:8px; border-left:none; border-top:none;}
 
  .emblem-wrap{
    display:flex;
    justify-content:center;
    margin-bottom:18px;
  }
  .emblem-ring{
    position:relative;
    width:104px; height:104px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:radial-gradient(circle, rgba(201,162,39,0.18), transparent 70%);
  }
  .emblem-ring img{
    width:96px; height:96px;
    border-radius:50%;
    object-fit:cover;
    box-shadow:
      0 0 0 3px var(--maroon-950),
      0 0 0 4px var(--gold-500),
      0 8px 24px rgba(0,0,0,0.5);
  }
 
  .institute{
    text-align:center;
    font-family:'Cormorant Garamond', serif;
    font-weight:700;
    font-size:26px;
    line-height:1.18;
    letter-spacing:0.3px;
    color:var(--gold-200);
    margin:0 0 4px;
  }
  .institute em{
    font-style:normal;
    color:var(--gold-400);
  }
 
  .tagline{
    text-align:center;
    font-family:'Josefin Sans', sans-serif;
    font-size:11px;
    letter-spacing:4px;
    text-transform:uppercase;
    color:var(--ink-dim);
    margin:0 0 26px;
  }
  .tagline span{ color:var(--gold-500); margin:0 6px; }
 
  .divider{
    height:1px;
    background:linear-gradient(90deg, transparent, rgba(201,162,39,0.5), transparent);
    margin:0 0 26px;
  }
 
  form{ display:flex; flex-direction:column; gap:18px; }
 
  .field{ display:flex; flex-direction:column; gap:7px; }
  .field label{
    font-family:'Josefin Sans', sans-serif;
    font-size:12px;
    letter-spacing:1.6px;
    text-transform:uppercase;
    color:var(--gold-400);
  }
  .field input{
    background:rgba(0,0,0,0.25);
    border:1px solid rgba(201,162,39,0.3);
    border-radius:3px;
    padding:12px 13px;
    font-family:'Inter',sans-serif;
    font-size:14.5px;
    color:var(--cream);
    outline:none;
    transition:border-color .15s ease, box-shadow .15s ease, background .15s ease;
  }
  .field input::placeholder{ color:rgba(199,171,154,0.5); }
  .field input:focus{
    border-color:var(--gold-500);
    background:rgba(0,0,0,0.35);
    box-shadow:0 0 0 3px rgba(201,162,39,0.18);
  }
  .field input:focus-visible{
    outline:2px solid var(--gold-400);
    outline-offset:2px;
  }
 
  .row-between{
    display:flex;
    align-items:center;
    justify-content:space-between;
    font-size:13px;
    margin-top:-4px;
  }
  .remember{
    display:flex; align-items:center; gap:8px;
    color:var(--ink-dim);
  }
  .remember input{
    width:15px; height:15px;
    accent-color:var(--gold-500);
  }
  .forgot{
    color:var(--gold-400);
    text-decoration:none;
    border-bottom:1px solid transparent;
  }
  .forgot:hover, .forgot:focus-visible{ border-bottom-color:var(--gold-400); }
 
  .error-msg{
    display:none;
    font-size:13px;
    color:var(--error);
    background:rgba(224,138,107,0.08);
    border:1px solid rgba(224,138,107,0.35);
    border-radius:3px;
    padding:9px 12px;
  }
  .error-msg.show{ display:block; }
 
  button.submit{
    margin-top:6px;
    border:1px solid var(--gold-500);
    background:linear-gradient(180deg, var(--gold-400), var(--gold-500));
    color:var(--maroon-950);
    font-family:'Josefin Sans', sans-serif;
    font-weight:600;
    font-size:13.5px;
    letter-spacing:2px;
    text-transform:uppercase;
    padding:13px;
    border-radius:3px;
    cursor:pointer;
    transition:transform .12s ease, box-shadow .12s ease, filter .12s ease;
  }
  button.submit:hover{ filter:brightness(1.08); box-shadow:0 6px 18px -6px rgba(201,162,39,0.5); }
  button.submit:active{ transform:translateY(1px); }
  button.submit:focus-visible{ outline:2px solid var(--gold-200); outline-offset:2px; }
 
  .footnote{
    text-align:center;
    margin-top:22px;
    font-size:12.5px;
    color:var(--ink-dim);
  }
  .footnote a{ color:var(--gold-400); text-decoration:none; }
  .footnote a:hover, .footnote a:focus-visible{ text-decoration:underline; }
 
  .college-meta{
    text-align:center;
    margin-top:28px;
    font-size:10.5px;
    letter-spacing:1.2px;
    text-transform:uppercase;
    color:rgba(199,171,154,0.55);
  }
 
  @media (max-width:420px){
    .card{ padding:36px 24px 28px; }
    .institute{ font-size:22px; }
  }
</style>
</head>
